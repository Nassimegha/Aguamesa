<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Aguamesa · banc de test nuit / niveaux (P1)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; touch-action: none; }
      #game-canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; white-space: pre-line;
        font: 600 14px/1.5 system-ui, sans-serif; color: #f6e7c8; pointer-events: none; text-shadow: 0 1px 2px #000;
      }
      #big {
        position: fixed; left: 16px; right: 16px; top: 34%; text-align: center; pointer-events: none;
        font: 800 56px/1.15 system-ui, sans-serif; color: #fff1c9; text-shadow: 0 2px 12px #000;
        opacity: 0; transition: opacity 0.2s; white-space: pre-line;
      }
      #big.show { opacity: 1; }
      #big small { display: block; font-size: 18px; font-weight: 600; margin-top: 10px; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <div id="big"></div>
    <script type="module" src="./nightDemo.ts"></script>
  </body>
</html>
