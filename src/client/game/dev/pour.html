<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Aguamesa · banc de test du versement (P1)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; touch-action: none; }
      #game-canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px;
        font: 600 14px/1.4 system-ui, sans-serif; color: #f6e7c8; pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #score {
        position: fixed; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none;
        font: 800 64px/1 system-ui, sans-serif; color: #fff1c9; text-shadow: 0 2px 12px #000;
        opacity: 0; transform: scale(0.8); transition: opacity 0.2s, transform 0.25s;
      }
      #score.show { opacity: 1; transform: scale(1); }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <div id="score"></div>
    <script type="module" src="./pourDemo.ts"></script>
  </body>
</html>
