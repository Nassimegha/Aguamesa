<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0, viewport-fit=cover"
    />
    <title>Aguamesa</title>
    <link rel="stylesheet" type="text/css" href="splash.css" />
  </head>
  <body class="app">
    <main class="splash">
      <p class="eyebrow">Daily</p>
      <h1 class="title">Aguamesa</h1>
      <p class="tagline">A pouring game.</p>

      <dl class="rows">
        <div class="row">
          <dt class="row-label">Night</dt>
          <dd class="row-value" id="night-value">&hellip;</dd>
        </div>
        <div class="row" id="location-row">
          <dt class="row-label">Location</dt>
          <dd class="row-value" id="location-value">&hellip;</dd>
        </div>
        <div class="row">
          <dt class="row-label">Streak</dt>
          <dd class="row-value" id="streak-value">&hellip;</dd>
        </div>
      </dl>
      <p class="streak-hint" id="streak-hint" hidden>Play every day to build your streak.</p>

      <button class="btn btn-primary" id="play-button" type="button">Start</button>

      <p class="footer">Same night for everyone. One try.</p>
    </main>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
