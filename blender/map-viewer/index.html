<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aguamesa Island</title>
<style>
  :root { --ink:#3b2a1e; --paper:#fbf1dc; --accent:#e0703c; }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfe6ee; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; touch-action:none; }
  canvas { display:block; }
  #hud-title { position:fixed; left:14px; top:12px; color:var(--paper); text-shadow:0 2px 6px rgba(40,25,10,.55); pointer-events:none; }
  #hud-title b { font-size:22px; letter-spacing:.5px; display:block; }
  #hud-title span { font-size:12px; opacity:.9; }
  #fps { position:fixed; right:10px; top:10px; background:rgba(30,22,16,.62); color:#ffe9b8; font:600 12px/1 ui-monospace,Consolas,monospace; padding:6px 8px; border-radius:8px; }
  #pins { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .pin { position:absolute; left:0; top:0; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; will-change:transform; }
  .pin .badge { display:flex; align-items:center; gap:6px; background:var(--paper); color:var(--ink); border:2.5px solid var(--c); border-radius:999px; padding:4px 10px 4px 4px; box-shadow:0 4px 10px rgba(40,25,10,.35); font-weight:700; font-size:13px; white-space:nowrap; transition:transform .15s; }
  .pin:hover .badge { transform:scale(1.08); }
  .pin .num { width:22px; height:22px; border-radius:50%; background:var(--c); color:#fff; display:grid; place-items:center; font-size:12px; }
  .pin .stem { width:3px; height:16px; background:var(--c); border-radius:2px; }
  .pin .dot { width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px rgba(255,255,255,.6); }
  .pin.locked .badge { background:#d9d6d2; color:#6b6460; border-color:#8a8580; }
  .pin.locked .num { background:#8a8580; }
  .pin.locked .stem, .pin.locked .dot { background:#8a8580; }
  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 24px); }
  #bar button, #side button { border:0; background:rgba(251,241,220,.94); color:var(--ink); font:700 12px "Trebuchet MS",system-ui,sans-serif; padding:8px 11px; border-radius:10px; box-shadow:0 3px 8px rgba(40,25,10,.3); cursor:pointer; }
  #bar button.on, #side button.on { background:var(--accent); color:#fff; }
  #side { position:fixed; right:10px; top:44px; display:flex; flex-direction:column; gap:6px; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#f3e3c3; color:var(--ink); font:700 18px "Trebuchet MS",sans-serif; z-index:10; transition:opacity .6s; }
  @media (max-width:640px) { #hud-title b { font-size:17px; } #bar button { padding:7px 8px; font-size:11px; } .pin .badge { font-size:11px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading the island…</div>
<div id="hud-title"><b>Aguamesa</b><span>Island map · pipeline test</span></div>
<div id="fps">FPS --</div>
<div id="pins"></div>
<div id="side">
  <button data-tod="0">Day</button>
  <button data-tod="1" class="on">Golden</button>
  <button data-tod="2">Night</button>
  <button id="lockbtn">Lock 3–6</button>
  <button id="overview">Overview</button>
</div>
<div id="bar"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const MOBILE = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(MOBILE ? 55 : 45, innerWidth / innerHeight, 0.5, 5000);
const OVERVIEW = { pos: new THREE.Vector3(-30, 120, 165), target: new THREE.Vector3(0, 2, 0) };
const portrait = () => THREE.MathUtils.clamp(0.75 / camera.aspect, 1, 1.9);
const overviewPos = () => OVERVIEW.target.clone().add(OVERVIEW.pos.clone().sub(OVERVIEW.target).multiplyScalar(portrait()));
camera.position.copy(overviewPos());

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(OVERVIEW.target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 340;
controls.maxPolarAngle = 1.36;
controls.screenSpacePanning = false;

// ---------------------------------------------------------------- time of day presets
const C = (h) => new THREE.Color(h);
const PRESETS = [
  { name: 'day', sunDir: new THREE.Vector3(0.45, 0.8, 0.35), sun: C('#fff1dc'), sunI: 2.7, hemiSky: C('#cfe8ff'), hemiGround: C('#e8d2a6'), hemiI: 1.15,
    zenith: C('#4b9fe0'), horizon: C('#d3ecf3'), fog: 0.0019, emissive: 0.5, deep: C('#1b7896'), shallow: C('#5fd3c7'), stars: 0, beam: 0.05, glow: 0.5 },
  { name: 'golden', sunDir: new THREE.Vector3(-0.62, 0.33, 0.48), sun: C('#ffc28a'), sunI: 2.6, hemiSky: C('#ffdcb8'), hemiGround: C('#b68e6a'), hemiI: 0.95,
    zenith: C('#5f86cc'), horizon: C('#ffcf9f'), fog: 0.0021, emissive: 1.2, deep: C('#246f8c'), shallow: C('#5fc6b9'), stars: 0, beam: 0.1, glow: 1.0 },
  { name: 'night', sunDir: new THREE.Vector3(0.35, 0.6, -0.55), sun: C('#a9bdff'), sunI: 0.6, hemiSky: C('#41558f'), hemiGround: C('#1a2133'), hemiI: 0.5,
    zenith: C('#0a1330'), horizon: C('#2c3c69'), fog: 0.0026, emissive: 2.2, deep: C('#0c2a44'), shallow: C('#1d5a6a'), stars: 1, beam: 0.42, glow: 0.3 },
];
const TOD = { from: 1, to: 1, t: 1, cur: {} };
function lerpPreset(a, b, t) {
  const o = {};
  for (const k in a) {
    if (a[k] instanceof THREE.Color) o[k] = a[k].clone().lerp(b[k], t);
    else if (a[k] instanceof THREE.Vector3) o[k] = a[k].clone().lerp(b[k], t).normalize();
    else if (typeof a[k] === 'number') o[k] = a[k] + (b[k] - a[k]) * t;
  }
  return o;
}

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -85, right: 85, top: 85, bottom: -85, near: 10, far: 400 });
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
scene.fog = new THREE.FogExp2(0xffffff, 0.003);

// ---------------------------------------------------------------- sky
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3() },
    uSunColor: { value: new THREE.Color() }, uStars: { value: 0 }, uGlow: { value: 1 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z = gl_Position.w; }`,
  fragmentShader: `
    uniform vec3 uZenith,uHorizon,uSunDir,uSunColor; uniform float uStars,uGlow; varying vec3 vDir;
    float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
    void main(){
      vec3 d = normalize(vDir);
      float y = d.y;
      vec3 c = mix(uHorizon, uZenith, pow(smoothstep(-0.02, 0.65, y), 0.75));
      float s = max(dot(d, normalize(uSunDir)), 0.0);
      c += uSunColor * (pow(s, 900.0) * 4.0 + pow(s, 10.0) * 0.28 * uGlow);
      if (uStars > 0.0) { vec3 q = floor(d * 260.0); float st = step(0.9975, h3(q)); c += vec3(st) * uStars * smoothstep(0.02, 0.25, y) * (0.6 + 0.4*h3(q+1.0)); }
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), skyMat);
sky.frustumCulled = false;
sky.renderOrder = -10;
scene.add(sky);

// ---------------------------------------------------------------- water (Reflector + custom shader)
const NOISE = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }`;
const WaterShader = {
  name: 'IslandWater',
  uniforms: {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTime: { value: 0 }, uHeight: { value: null }, uExtent: { value: 240 }, uHmin: { value: -8 }, uHrange: { value: 12 },
    uSunDir: { value: new THREE.Vector3() }, uSunColor: { value: new THREE.Color() }, uDeep: { value: new THREE.Color() },
    uShallow: { value: new THREE.Color() }, uFogColor: { value: new THREE.Color() }, uFogDensity: { value: 0.003 }, uNight: { value: 0 },
  },
  vertexShader: `
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
    void main(){ vUv = textureMatrix * vec4(position,1.0); vec4 w = modelMatrix*vec4(position,1.0); vWorld = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    uniform vec3 color; uniform sampler2D tDiffuse; varying vec4 vUv; varying vec3 vWorld;
    uniform float uTime, uExtent, uHmin, uHrange, uFogDensity, uNight; uniform sampler2D uHeight;
    uniform vec3 uSunDir, uSunColor, uDeep, uShallow, uFogColor;
    ${NOISE}
    float waves(vec2 p){
      float t = uTime;
      float h = vnoise(p*0.11 + vec2(t*0.04, t*0.025));
      h += 0.5*vnoise(p*0.27 - vec2(t*0.06, -t*0.035));
      h += 0.25*vnoise(p*0.75 + vec2(t*0.11, t*0.09));
      h += 0.12*vnoise(p*1.9 - vec2(t*0.2, t*0.13));
      h += 0.35*sin(p.x*0.07 + p.y*0.045 + t*0.7);
      return h;
    }
    void main(){
      vec3 toCam = cameraPosition - vWorld; float dist = length(toCam); vec3 V = toCam/dist;
      vec2 p = vWorld.xz;
      float e = 0.3;
      float k = mix(0.9, 0.18, smoothstep(25.0, 380.0, dist));
      float h0 = waves(p), hx = waves(p+vec2(e,0.)), hz = waves(p+vec2(0.,e));
      vec3 n = normalize(vec3(-(hx-h0)/e*k, 1.0, -(hz-h0)/e*k));
      vec2 huv = vec2((p.x + uExtent)/(2.0*uExtent), (-p.y + uExtent)/(2.0*uExtent));
      float th = uHmin;
      if (huv.x > 0.0 && huv.x < 1.0 && huv.y > 0.0 && huv.y < 1.0) th = uHmin + texture2D(uHeight, huv).r * uHrange;
      float depth = max(-th, 0.0);
      vec2 ruv = vUv.xy / vUv.w + n.xz * 0.035;
      vec3 refl = texture2D(tDiffuse, ruv).rgb;
      float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
      fres = clamp(fres * 0.95 + 0.06, 0.0, 0.72);
      vec3 water = mix(uShallow, uDeep, smoothstep(0.0, 5.5, depth));
      float sh = vnoise(p*0.55 + uTime*0.35) * vnoise(p*0.8 - uTime*0.27);
      water += uShallow * sh * 0.35 * (1.0 - smoothstep(0.0, 3.0, depth));
      vec3 col = mix(water, refl, fres);
      vec3 R = reflect(-normalize(uSunDir), n);
      col += uSunColor * pow(max(dot(R, V), 0.0), 220.0) * 3.0;
      float fn = vnoise(p*1.3 + vec2(uTime*0.25, -uTime*0.18));
      float shore = 1.0 - smoothstep(0.0, 0.35 + 0.3*fn, depth);
      float band = smoothstep(0.78, 1.0, sin(depth*4.5 - uTime*1.5 + fn*2.5)*0.5+0.5) * (1.0 - smoothstep(0.25, 1.9, depth));
      float foam = clamp(shore*0.95 + band*0.75*smoothstep(0.25, 0.6, fn), 0.0, 1.0);
      col = mix(col, vec3(mix(1.0, 0.55, uNight)), foam * 0.9);
      float alpha = mix(0.55, 1.0, smoothstep(0.0, 4.0, depth));
      alpha = max(alpha, foam);
      float ff = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
      col = mix(col, uFogColor, ff);
      alpha = mix(alpha, 1.0, ff);
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
};
const reflScale = MOBILE ? 0.35 : 0.5;
const water = new Reflector(new THREE.PlaneGeometry(6000, 6000), {
  shader: WaterShader, clipBias: 0.003,
  textureWidth: innerWidth * renderer.getPixelRatio() * reflScale, textureHeight: innerHeight * renderer.getPixelRatio() * reflScale,
});
water.rotation.x = -Math.PI / 2;
water.material.transparent = true;
water.renderOrder = 1;
scene.add(water);
const WU = water.material.uniforms;

// ---------------------------------------------------------------- helpers
const softTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const LOC_COLORS = ['#c9573f', '#2f9e95', '#5679c4', '#d79a1e', '#8a5a33', '#7c4bb8'];

// ---------------------------------------------------------------- state
const app = { ready: false, locs: [], anim: {}, glowMats: [], flight: null, lockDemo: false };
window.__app = app;

// ---------------------------------------------------------------- load
const [gltf, meta, hmTex] = await Promise.all([
  new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('island-opt.glb'),
  fetch('map_meta.json').then(r => r.json()),
  new THREE.TextureLoader().loadAsync('heightmap.png'),
]);
hmTex.colorSpace = THREE.NoColorSpace;
hmTex.wrapS = hmTex.wrapT = THREE.ClampToEdgeWrapping;
WU.uHeight.value = hmTex;
WU.uExtent.value = meta.extent; WU.uHmin.value = meta.heightMin; WU.uHrange.value = meta.heightRange;

const island = gltf.scene;
scene.add(island);
let tris = 0;
island.traverse((o) => {
  if (!o.isMesh) return;
  tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
  const m = o.material;
  m.flatShading = true;
  m.needsUpdate = true;
  if (m.emissive && m.emissive.getHex() !== 0) { m.userData.baseEmissive = m.emissiveIntensity; app.glowMats.push(m); }
  else { o.castShadow = true; o.receiveShadow = true; }
});
app.tris = Math.round(tris);

const ray = new THREE.Raycaster();
const occluders = [];
island.getObjectByName('Island_Base_mesh')?.traverse((o) => { if (o.isMesh) occluders.push(o); });
// river: flowing shader
const river = island.getObjectByName('River');
const riverMat = new THREE.ShaderMaterial({
  vertexColors: true, transparent: true, fog: false,
  uniforms: { uTime: { value: 0 }, uFogColor: WU.uFogColor, uFogDensity: WU.uFogDensity, uNight: WU.uNight },
  vertexShader: `varying vec2 vUv; varying vec3 vCol; varying vec3 vWorld;
    void main(){ vUv = uv; vCol = color; vec4 w = modelMatrix*vec4(position,1.); vWorld = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uTime, uFogDensity, uNight; uniform vec3 uFogColor; varying vec2 vUv; varying vec3 vCol; varying vec3 vWorld;
    ${NOISE}
    void main(){
      float f = vnoise(vec2(vUv.x*3.0, vUv.y*6.0 - uTime*2.2)) * vnoise(vec2(vUv.x*7.0+3.0, vUv.y*14.0 - uTime*3.1));
      float edge = smoothstep(0.32, 0.0, min(vUv.x, 1.0 - vUv.x));
      vec3 c = vCol * mix(1.0, 0.45, uNight) + smoothstep(0.25, 0.55, f + edge*0.4) * 0.55 * mix(1.0, 0.5, uNight);
      float dist = length(cameraPosition - vWorld);
      c = mix(c, uFogColor, 1.0 - exp(-uFogDensity*uFogDensity*dist*dist));
      gl_FragColor = vec4(c, 0.88);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
river?.traverse((o) => { if (o.isMesh) { o.material = riverMat; o.castShadow = false; o.receiveShadow = false; } });

// locations
const lockedCache = new Map();
function lockedVariant(m) {
  if (lockedCache.has(m)) return lockedCache.get(m);
  const lm = m.clone();
  lm.emissiveIntensity = 0;
  lm.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
      diffuseColor.rgb = mix(vec3(lum) * vec3(0.88, 0.9, 0.97), vec3(0.55, 0.57, 0.63), 0.4);`);
  };
  lm.customProgramCacheKey = () => 'locked';
  lockedCache.set(m, lm);
  return lm;
}
const pinsEl = document.getElementById('pins');
const barEl = document.getElementById('bar');
for (const L of meta.locations) {
  const root = island.getObjectByName(L.node);
  const pinObj = island.getObjectByName('PIN_' + L.id);
  const ct = island.getObjectByName('CAMT_' + L.id);
  const cp = island.getObjectByName('CAMP_' + L.id);
  const w = (o, fallback) => o ? o.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(...fallback);
  const loc = { ...L, root, pin: w(pinObj, L.pin), camTarget: w(ct, L.camTarget), camPos: w(cp, L.camPos), locked: false, meshes: [] };
  root?.traverse((o) => { if (o.isMesh) { o.userData.origMat = o.material; loc.meshes.push(o); } });
  // locked fog puffs
  const fog = new THREE.Group();
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xc9cdd6, transparent: true, opacity: 0.0, depthWrite: false, fog: true }));
    const a = (i / 9) * Math.PI * 2, r = 4 + Math.random() * 7;
    s.position.set(Math.cos(a) * r, 2 + Math.random() * 5, Math.sin(a) * r);
    s.scale.setScalar(10 + Math.random() * 8);
    s.userData.phase = Math.random() * 6.28;
    fog.add(s);
  }
  fog.position.copy(loc.camTarget).add(new THREE.Vector3(0, -2, 0));
  scene.add(fog);
  loc.fog = fog;
  // HTML pin
  const el = document.createElement('div');
  el.className = 'pin';
  el.style.setProperty('--c', LOC_COLORS[L.id - 1]);
  el.innerHTML = `<div class="badge"><span class="num">${L.id}</span><span class="lbl">${L.name}</span></div><div class="stem"></div><div class="dot"></div>`;
  el.addEventListener('click', (ev) => { ev.stopPropagation(); goTo(loc); });
  pinsEl.appendChild(el);
  loc.el = el;
  const b = document.createElement('button');
  b.textContent = `${L.id} · ${L.name}`;
  b.onclick = () => goTo(loc);
  barEl.appendChild(b);
  loc.btn = b;
  app.locs.push(loc);
}
function setLocked(loc, v) {
  loc.locked = v;
  for (const o of loc.meshes) o.material = v ? lockedVariant(o.userData.origMat) : o.userData.origMat;
  loc.el.classList.toggle('locked', v);
  loc.el.querySelector('.num').textContent = v ? '🔒' : loc.id;
}
app.setLocked = setLocked;

// animated objects from the glb
const named = (n) => island.getObjectByName(n);
const bobbers = [];
for (const n of ['PirateShip', 'Rowboat', 'Buoy_1', 'Buoy_2', 'Buoy_3', 'Buoy_4', 'Buoy_5', 'Buoy_6']) {
  const o = named(n);
  if (o) bobbers.push({ o, y: o.position.y, q: o.quaternion.clone(), ph: Math.random() * 6.28, amp: n === 'PirateShip' ? 0.16 : 0.12, roll: n === 'PirateShip' ? 0.035 : 0.09 });
}
const wheel = named('FerrisWheel'), carousel = named('Carousel');
const dolphin = named('Dolphin'), whale = named('WhaleTail');
if (dolphin) dolphin.visible = false;
if (whale) whale.visible = false;

// chimney smoke
const smokeAnchor = named('SMOKE_3');
const smoke = [];
if (smokeAnchor) {
  const base = smokeAnchor.getWorldPosition(new THREE.Vector3());
  for (let i = 0; i < 16; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xf2f0ee, transparent: true, depthWrite: false }));
    s.userData = { t: i / 16, base };
    scene.add(s); smoke.push(s);
  }
}

// lighthouse rotating beam
const lamp = named('LIGHTHOUSE_LAMP');
const beam = new THREE.Group();
const beamMat = new THREE.MeshBasicMaterial({ vertexColors: true, color: 0xfff0b8, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: true });
if (lamp) {
  lamp.getWorldPosition(beam.position);
  for (const s of [1, -1]) {
    const g = new THREE.ConeGeometry(7, 90, 20, 6, true);
    g.translate(0, -45, 0);
    const pa = g.attributes.position, col = [];
    for (let k = 0; k < pa.count; k++) { const f = Math.pow(Math.max(0, 1 + pa.getY(k) / 90), 1.6); col.push(f, f, f); }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.rotateZ(s * Math.PI / 2);
    beam.add(new THREE.Mesh(g, beamMat));
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xffe7a0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.setScalar(9); beam.add(glow); beam.userData.glow = glow;
  scene.add(beam);
}

// birds (seagulls) + bats
function makeBird(color, size) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide, flatShading: true });
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.18 * size, 1.0 * size, 4), mat);
  body.rotation.x = Math.PI / 2; g.add(body);
  for (const s of [1, -1]) {
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -0.35 * size, 0, 0, 0.3 * size, s * 1.4 * size, 0, -0.1 * size], 3));
    wg.computeVertexNormals();
    const w = new THREE.Mesh(wg, mat); w.userData.s = s; g.add(w);
  }
  return g;
}
const gulls = [], bats = [];
for (let i = 0; i < (MOBILE ? 5 : 9); i++) {
  const b = makeBird(0xf7f7f2, 1.2);
  b.userData = { r: 25 + Math.random() * 40, h: 22 + Math.random() * 16, sp: 0.12 + Math.random() * 0.1, ph: Math.random() * 6.28, cx: (Math.random() - .5) * 30, cz: (Math.random() - .5) * 30, flap: 5 + Math.random() * 2 };
  scene.add(b); gulls.push(b);
}
const batAnchor = named('BATS_6');
if (batAnchor) {
  const bp = batAnchor.getWorldPosition(new THREE.Vector3());
  for (let i = 0; i < 8; i++) {
    const b = makeBird(0x2a2033, 0.45);
    b.userData = { r: 4 + Math.random() * 6, h: bp.y + (Math.random() - .5) * 4, sp: 0.6 + Math.random() * 0.5, ph: Math.random() * 6.28, cx: bp.x, cz: bp.z, flap: 14 + Math.random() * 5 };
    scene.add(b); bats.push(b);
  }
}

// clouds
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.55, flatShading: true, transparent: true, opacity: 0.9, fog: true });
const clouds = [];
for (let i = 0; i < (MOBILE ? 8 : 14); i++) {
  const c = new THREE.Group();
  const n = 4 + Math.floor(Math.random() * 4);
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 0), cloudMat);
    m.position.set((k - n / 2) * 4 + Math.random() * 2, Math.random() * 2, (Math.random() - .5) * 5);
    m.scale.set(4 + Math.random() * 3, 2.4 + Math.random() * 1.5, 3.5 + Math.random() * 2);
    c.add(m);
  }
  c.position.set((Math.random() - .5) * 600, 60 + Math.random() * 35, (Math.random() - .5) * 600);
  c.userData.sp = 1.5 + Math.random() * 2;
  scene.add(c); clouds.push(c);
}

// splash rings (dolphin / whale)
const splashes = [];
function splash(p) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.4, 1.0, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.08, p.z);
  scene.add(m); splashes.push({ m, t: 0 });
}

// player marker ("the last drop") moving along the path
const path = meta.path.map((p) => new THREE.Vector3(...p));
const marker = new THREE.Group();
{
  const mat = new THREE.MeshStandardMaterial({ color: 0x4fb8f0, emissive: 0x1a6aa8, emissiveIntensity: 0.6, roughness: 0.25, flatShading: true });
  const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 1), mat); s.position.y = 0.75;
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.1, 10), mat); c.position.y = 1.65;
  marker.add(s, c);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.8, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.06; marker.add(sh);
  marker.children.forEach(o => o.castShadow = o !== sh);
}
scene.add(marker);
const walker = { idx: app.locs[0]?.pathIndex ?? 0, target: app.locs[0]?.pathIndex ?? 0, f: 0 };
walker.f = walker.idx;
marker.position.copy(path[walker.idx]);

// ---------------------------------------------------------------- camera flights
function flyTo(pos, target, dur = 1.8) {
  app.flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), t: 0, dur };
}
function goTo(loc) {
  const p = loc.camTarget.clone().add(loc.camPos.clone().sub(loc.camTarget).multiplyScalar(Math.min(portrait(), 1.5)));
  flyTo(p, loc.camTarget);
  walker.target = loc.pathIndex;
  app.current = loc.id;
  app.locs.forEach(l => l.btn.classList.toggle('on', l === loc));
}
app.goTo = (id) => goTo(app.locs.find(l => l.id === id));
app.overview = () => { flyTo(overviewPos(), OVERVIEW.target); app.locs.forEach(l => l.btn.classList.remove('on')); };
document.getElementById('overview').onclick = app.overview;
document.getElementById('lockbtn').onclick = (e) => {
  app.lockDemo = !app.lockDemo;
  e.target.classList.toggle('on', app.lockDemo);
  app.locs.forEach(l => setLocked(l, app.lockDemo && l.id >= 3));
};
function setTOD(i) {
  TOD.from = TOD.cur; TOD.to = PRESETS[i]; TOD.t = 0; TOD.idx = i;
  document.querySelectorAll('[data-tod]').forEach(b => b.classList.toggle('on', +b.dataset.tod === i));
}
document.querySelectorAll('[data-tod]').forEach(b => b.onclick = () => setTOD(+b.dataset.tod));
app.setTOD = setTOD;
TOD.cur = lerpPreset(PRESETS[1], PRESETS[1], 0); TOD.from = TOD.cur; TOD.to = PRESETS[1]; TOD.t = 1;

function applyTOD(p) {
  sun.color.copy(p.sun); sun.intensity = p.sunI;
  sun.position.copy(p.sunDir).multiplyScalar(180); sun.target.position.set(0, 0, 0);
  hemi.color.copy(p.hemiSky); hemi.groundColor.copy(p.hemiGround); hemi.intensity = p.hemiI;
  skyMat.uniforms.uZenith.value.copy(p.zenith); skyMat.uniforms.uHorizon.value.copy(p.horizon);
  skyMat.uniforms.uSunDir.value.copy(p.sunDir); skyMat.uniforms.uSunColor.value.copy(p.sun);
  skyMat.uniforms.uStars.value = p.stars; skyMat.uniforms.uGlow.value = p.glow;
  scene.fog.color.copy(p.horizon); scene.fog.density = p.fog;
  WU.uSunDir.value.copy(p.sunDir); WU.uSunColor.value.copy(p.sun).multiplyScalar(p.sunI / 2.6);
  WU.uDeep.value.copy(p.deep); WU.uShallow.value.copy(p.shallow); WU.uFogColor.value.copy(p.horizon);
  WU.uFogDensity.value = p.fog; WU.uNight.value = p.stars;
  for (const m of app.glowMats) m.emissiveIntensity = Math.min(m.userData.baseEmissive ?? 1, 1.2) * p.emissive;
  beamMat.opacity = p.beam;
  if (beam.userData.glow) beam.userData.glow.material.opacity = 0.3 + p.beam * 1.6;
  cloudMat.color.setRGB(1, 1, 1).lerp(p.horizon, 0.3); cloudMat.emissive.copy(p.horizon).lerp(new THREE.Color(1, 1, 1), 0.5); cloudMat.emissiveIntensity = 0.55 * (1 - 0.75 * p.stars);
}
applyTOD(TOD.cur);

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps');
let frames = 0, acc = 0;
const tmp = new THREE.Vector3();
let dolphinState = { next: 3, t: -1 }, whaleState = { next: 8, t: -1 };

function rndSeaPoint(rmin, rmax) {
  const a = Math.random() * Math.PI * 2, r = rmin + Math.random() * (rmax - rmin);
  return new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  frames++; acc += dt;
  if (acc >= 0.5) { app.fps = Math.round(frames / acc); fpsEl.textContent = `FPS ${app.fps} · ${(app.tris / 1000).toFixed(0)}k tris`; frames = 0; acc = 0; }

  if (TOD.t < 1) { TOD.t = Math.min(1, TOD.t + dt / 2.5); TOD.cur = lerpPreset(TOD.from, TOD.to, easeInOut(TOD.t)); applyTOD(TOD.cur); }

  WU.uTime.value = t; riverMat.uniforms.uTime.value = t;
  for (const b of bobbers) {
    b.o.position.y = b.y + Math.sin(t * 1.1 + b.ph) * b.amp;
    b.o.quaternion.copy(b.q).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(t * 0.8 + b.ph) * b.roll * 0.6, 0, Math.sin(t * 1.25 + b.ph) * b.roll)));
  }
  if (wheel) wheel.rotateZ(-dt * 0.22);
  if (carousel) carousel.rotateY(dt * 0.6);
  beam.rotation.y = t * 0.7;

  for (const s of smoke) {
    const u = (s.userData.t + t * 0.09) % 1;
    s.position.copy(s.userData.base).add(tmp.set(Math.sin(u * 6 + s.userData.t * 9) * 0.5 + u * 2.5, u * 9, u * 1.2));
    s.scale.setScalar(0.8 + u * 3.5);
    s.material.opacity = Math.sin(Math.PI * u) * 0.55;
  }
  for (const g of [...gulls, ...bats]) {
    const d = g.userData, a = t * d.sp + d.ph;
    g.position.set(d.cx + Math.cos(a) * d.r, d.h + Math.sin(t * 0.7 + d.ph) * 1.5, d.cz + Math.sin(a) * d.r);
    g.rotation.y = -a;
    g.children.forEach((w) => { if (w.userData.s) w.rotation.z = w.userData.s * Math.sin(t * d.flap + d.ph) * 0.55; });
  }
  for (const c of clouds) { c.position.x += c.userData.sp * dt; if (c.position.x > 320) c.position.x = -320; }
  for (const L of app.locs) {
    L.fog.children.forEach((s) => {
      const target = L.locked ? 0.55 : 0;
      s.material.opacity += (target - s.material.opacity) * Math.min(1, dt * 2);
      s.position.y += Math.sin(t * 0.4 + s.userData.phase) * 0.01;
    });
    L.fog.visible = L.fog.children[0].material.opacity > 0.01;
  }

  // dolphin jumps
  if (dolphin) {
    if (dolphinState.t < 0 && t > dolphinState.next) {
      const p = rndSeaPoint(72, 110);
      const dir = new THREE.Vector3(-p.z, 0, p.x).normalize();
      dolphinState = { t: 0, p, dir, next: 0 };
      dolphin.visible = true; splash(p);
    }
    if (dolphinState.t >= 0) {
      dolphinState.t += dt / 1.5;
      const u = dolphinState.t;
      const pos = dolphinState.p.clone().addScaledVector(dolphinState.dir, u * 11);
      pos.y = -1.2 + Math.sin(Math.PI * u) * 4.2;
      const vel = dolphinState.dir.clone().multiplyScalar(11); vel.y = Math.cos(Math.PI * u) * 4.2 * Math.PI;
      dolphin.position.copy(pos); dolphin.lookAt(pos.clone().sub(vel));
      if (u >= 1) { splash(pos); dolphin.visible = false; dolphinState = { t: -1, next: t + 5 + Math.random() * 6 }; }
    }
  }
  if (whale) {
    if (whaleState.t < 0 && t > whaleState.next) {
      whaleState = { t: 0, p: rndSeaPoint(95, 150), next: 0 }; whale.visible = true;
      whale.rotation.y = Math.random() * 6.28; splash(whaleState.p);
    }
    if (whaleState.t >= 0) {
      whaleState.t += dt / 5;
      const u = whaleState.t;
      whale.position.set(whaleState.p.x, -4.2 + Math.sin(Math.PI * u) * 4.6, whaleState.p.z);
      whale.rotation.x = (u - 0.5) * 0.7;
      if (u >= 1) { whale.visible = false; splash(whaleState.p); whaleState = { t: -1, next: t + 12 + Math.random() * 10 }; }
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.t += dt;
    s.m.scale.setScalar(1 + s.t * 4); s.m.material.opacity = Math.max(0, 0.9 - s.t * 0.7);
    if (s.t > 1.3) { scene.remove(s.m); s.m.geometry.dispose(); splashes.splice(i, 1); }
  }

  // marker walks along the path
  if (Math.abs(walker.target - walker.f) > 0.01) {
    const dir = Math.sign(walker.target - walker.f);
    walker.f += dir * dt * 9 / 2.4; // ~9 units/s (path samples are ~2.4 apart)
    if (Math.sign(walker.target - walker.f) !== dir) walker.f = walker.target;
  }
  {
    const i0 = Math.floor(walker.f), i1 = Math.min(i0 + 1, path.length - 1), fr = walker.f - i0;
    marker.position.lerpVectors(path[i0], path[i1], fr);
    marker.position.y = Math.max(marker.position.y, 0.1);
    const moving = Math.abs(walker.target - walker.f) > 0.01;
    marker.children[0].position.y = 0.75 + (moving ? Math.abs(Math.sin(t * 10)) * 0.5 : Math.sin(t * 2) * 0.12);
    marker.children[1].position.y = marker.children[0].position.y + 0.9;
    if (moving) { const dirv = tmp.subVectors(path[i1], path[i0]); marker.rotation.y = Math.atan2(dirv.x, dirv.z); }
  }

  // camera flight
  if (app.flight) {
    const f = app.flight; f.t += dt / f.dur;
    const u = easeInOut(Math.min(f.t, 1));
    camera.position.lerpVectors(f.p0, f.p1, u);
    camera.position.y += Math.sin(Math.PI * u) * 18;
    controls.target.lerpVectors(f.t0, f.t1, u);
    if (f.t >= 1) app.flight = null;
  }
  controls.enabled = !app.flight;
  controls.update();
  if (camera.position.y < 3) camera.position.y = 3;
  controls.target.y = Math.max(controls.target.y, 0);
  const tl = Math.hypot(controls.target.x, controls.target.z);
  if (tl > 220) { controls.target.x *= 220 / tl; controls.target.z *= 220 / tl; }

  sky.position.copy(camera.position);
  renderer.render(scene, camera);

  // pins (after render so matrices are fresh); occlusion test against the island every 12 frames
  const w2 = innerWidth / 2, h2 = innerHeight / 2;
  if ((app.frameNo = (app.frameNo || 0) + 1) % 12 === 0 && occluders.length) {
    for (const L of app.locs) {
      const d = tmp.copy(L.pin).sub(camera.position); const len = d.length();
      ray.set(camera.position, d.normalize()); ray.far = len - 2;
      L.occluded = ray.intersectObjects(occluders, false).length > 0;
      L.el.style.opacity = L.occluded ? '0.35' : '1';
    }
  }
  for (const L of app.locs) {
    tmp.copy(L.pin); tmp.y += Math.sin(t * 2 + L.id) * 0.35;
    const camDist = camera.position.distanceTo(tmp);
    tmp.project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
    L.el.style.display = vis ? 'flex' : 'none';
    if (vis) {
      const s = THREE.MathUtils.clamp(90 / camDist, 0.7, 1.15);
      L.el.style.transform = `translate(${(tmp.x * w2 + w2).toFixed(1)}px, ${(-tmp.y * h2 + h2).toFixed(1)}px) translate(-50%,-100%) scale(${s.toFixed(3)})`;
      L.el.style.zIndex = String(10000 - Math.round(camDist));
    }
  }
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  water.getRenderTarget().setSize(innerWidth * renderer.getPixelRatio() * reflScale, innerHeight * renderer.getPixelRatio() * reflScale);
});

document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 700);
app.ready = true;
requestAnimationFrame(tick);
</script>
</body>
</html>
